set-option -g default-terminal "tmux-256color"
set-option -as terminal-features ",*:RGB"
# Pass Ghostty's CSI u keys (Shift+Enter) through to apps
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ',xterm-ghostty:extkeys'

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

set -g mouse on
# Fix scroll speed
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Closing a session's last window jumps to another session instead of detaching
set -g detach-on-destroy off

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n C-f run-shell 'tmux-sessionizer'

# Alt+\ toggles a floating scratch terminal. detach-on-destroy stays on for
# scratch (overriding the global off) so exiting its shell closes the popup
# instead of re-attaching another session inside it.
bind -n 'M-\' if-shell -F '#{==:#{session_name},scratch}' 'detach-client' 'display-popup -E -w 80% -h 75% "tmux new-session -d -s scratch 2>/dev/null; tmux set-option -t scratch detach-on-destroy on; tmux attach-session -t scratch"'

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Alt+number to jump to window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_with_mouse off # Disable auto-copy on mouse release

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind v copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# Ctrl+Shift+C arrives as C-S-c (CSI u) or C-S-C (modifyOtherKeys) depending on the encoding
bind-key -T copy-mode-vi C-S-c send-keys -X copy-pipe-and-cancel
bind-key -T copy-mode-vi C-S-C send-keys -X copy-pipe-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane
bind-key -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line
bind-key -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word }
bind-key -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line }
set -g copy-mode-selection-style "bg=#585b70"

set-option -g automatic-rename-format '#{b:pane_current_path}'

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text "#[fg=#{@thm_overlay_1}] #W"
set -g @catppuccin_window_current_text "#[bold] #W"
set -g @catppuccin_window_flags "icon"
set -g @catppuccin_window_flags_icon_current ""
set -g @catppuccin_window_flags_icon_last ""
# Round both ends of the status modules (the default right end is square)
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_connect_separator "no"
# The rounded window caps take their color from this, so it can't be "none".
set -g @catppuccin_status_background "#{@thm_bg}"
# tmux 3.8 defaults this to underscore, which catppuccin doesn't override
set -g window-status-current-style default

set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session} #[fg=#{@thm_overlay_0}]| "
set -g status-right "#{E:@catppuccin_status_application}"
# Blank row above the bar so a full screen's prompt doesn't sit right on it.
# Reset first so a reload copies the default bar, not the blank row.
set -g status 2
set -gu status-format
set -gF 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[0]' ''

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

run '~/.config/tmux/plugins/tpm/tpm'
